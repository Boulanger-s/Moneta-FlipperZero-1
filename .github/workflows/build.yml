name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # The TLV parser eats attacker-controlled bytes off a radio, and the grade is
  # the only part of this app a user actually acts on. Neither can be vouched
  # for by a screenshot, so both are plain C with no Flipper headers and get
  # checked under the sanitisers on every push.
  test:
    runs-on: ubuntu-latest
    name: EMV engine
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build Moneta
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: moneta-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
